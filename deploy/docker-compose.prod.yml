# Production stack for the deploy VM (GCP e2-micro free tier).
#
# Unlike the dev compose file at the repo root, this one PULLS the service images
# from GHCR (built by CI) instead of building them, and adds Caddy in front for
# TLS termination + automatic HTTPS.
#
# Run it from this directory:
#   ./deploy.sh                       # pull, migrate, restart
#   docker compose -f docker-compose.prod.yml up -d
#
# Config comes from ./.env (git-ignored) — see .env.example.

name: dipstick

# Cap every container's logs so months of output can't fill the 30 GB disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17
    # Trim max_connections for the 1 GB e2-micro — our two services use ~20
    # pooled connections total, so 40 is ample headroom.
    command: ["postgres", "-c", "max_connections=40"]
    environment:
      POSTGRES_USER: dipstick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: dipstick
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dipstick -d dipstick"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  vehicle-migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend/vehicle-service/migrations:/migrations:ro
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://dipstick:${POSTGRES_PASSWORD}@postgres:5432/dipstick?sslmode=disable&search_path=vehicle",
        "up",
      ]
    restart: on-failure
    logging: *default-logging

  activity-migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend/activity-service/migrations:/migrations:ro
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://dipstick:${POSTGRES_PASSWORD}@postgres:5432/dipstick?sslmode=disable&search_path=activity",
        "up",
      ]
    restart: on-failure
    logging: *default-logging

  vehicle-service:
    image: ghcr.io/colinfriedel/dipstick-vehicle-service:${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      vehicle-migrate:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      DB_SCHEMA: vehicle
      DATABASE_URL: "postgres://dipstick:${POSTGRES_PASSWORD}@postgres:5432/dipstick?sslmode=disable"
    restart: unless-stopped
    logging: *default-logging

  activity-service:
    image: ghcr.io/colinfriedel/dipstick-activity-service:${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      activity-migrate:
        condition: service_completed_successfully
      vehicle-service:
        condition: service_started
    environment:
      PORT: "8080"
      DB_SCHEMA: activity
      DATABASE_URL: "postgres://dipstick:${POSTGRES_PASSWORD}@postgres:5432/dipstick?sslmode=disable"
      VEHICLE_SERVICE_URL: "http://vehicle-service:8080"
    restart: unless-stopped
    logging: *default-logging

  # Keeps the two DuckDNS names pointed at whatever the VM's current public IP is,
  # so we don't need a reserved IP. Empty `ip=` tells DuckDNS to use the source
  # address of the request (this container's egress = the VM's public IP).
  duckdns:
    image: curlimages/curl:latest
    environment:
      DUCKDNS_DOMAINS: ${DUCKDNS_DOMAINS:?set DUCKDNS_DOMAINS in deploy/.env}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?set DUCKDNS_TOKEN in deploy/.env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'while true; do
           curl -fsS "https://www.duckdns.org/update?domains=$${DUCKDNS_DOMAINS}&token=$${DUCKDNS_TOKEN}&ip=" && echo " [duckdns] updated $(date -u)";
           sleep 300;
         done'
    restart: unless-stopped
    logging: *default-logging

  caddy:
    image: caddy:2
    depends_on:
      - vehicle-service
      - activity-service
    ports:
      - "80:80"
      - "443:443"
    environment:
      VEHICLE_DOMAIN: ${VEHICLE_DOMAIN:?set VEHICLE_DOMAIN in deploy/.env}
      ACTIVITY_DOMAIN: ${ACTIVITY_DOMAIN:?set ACTIVITY_DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
