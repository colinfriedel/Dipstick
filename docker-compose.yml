# Local development stack for Dipstick's backend.
#
# `docker compose up` starts, in dependency order:
#   1. postgres           - the database
#   2. vehicle-migrate     - one-shot: applies vehicle-service migrations, then exits
#   3. vehicle-service     - the Vehicle CRUD API
#   4. activity-migrate    - one-shot: applies activity-service migrations, then exits
#   5. activity-service    - the fuel/maintenance API; calls vehicle-service over HTTP
#
# Compose puts every service on a shared user-defined network and registers each
# one under its service name as a DNS hostname. That's why the connection
# strings below say `@postgres:5432` and `http://vehicle-service:8080` — inside
# this network, those names resolve to the right containers. The host machine
# reaches things only through the published `ports:` mappings.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dipstick
      POSTGRES_PASSWORD: dipstick
      POSTGRES_DB: dipstick
    ports:
      # host:container — connect from your Mac (psql, a GUI) on localhost:5432
      - "5432:5432"
    volumes:
      # Named volume: the actual data files, so they survive `docker compose down`.
      - postgres-data:/var/lib/postgresql/data
      # Bind mount: our one-time schema setup, run on first init only.
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `condition: service_healthy` on other services waits for this to pass.
      test: ["CMD-SHELL", "pg_isready -U dipstick -d dipstick"]
      interval: 5s
      timeout: 5s
      retries: 10

  vehicle-migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/vehicle-service/migrations:/migrations:ro
    # search_path=vehicle => golang-migrate's own schema_migrations bookkeeping
    # table, and anything the migrations create, land in the `vehicle` schema.
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://dipstick:dipstick@postgres:5432/dipstick?sslmode=disable&search_path=vehicle",
        "up",
      ]

  vehicle-service:
    build: ./backend/vehicle-service
    depends_on:
      postgres:
        condition: service_healthy
      vehicle-migrate:
        # Wait for the migrate container to run to completion (exit 0).
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      DB_SCHEMA: "vehicle"
      DATABASE_URL: "postgres://dipstick:dipstick@postgres:5432/dipstick?sslmode=disable"
    ports:
      # API is on http://localhost:8081 from the host.
      - "8081:8080"

  activity-migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/activity-service/migrations:/migrations:ro
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://dipstick:dipstick@postgres:5432/dipstick?sslmode=disable&search_path=activity",
        "up",
      ]

  activity-service:
    build: ./backend/activity-service
    depends_on:
      postgres:
        condition: service_healthy
      activity-migrate:
        condition: service_completed_successfully
      # We wait for vehicle-service's container to *start* so the hostname
      # resolves, but not for it to be "healthy" — activity-service handles
      # vehicle-service being unready at request time (503 on create).
      vehicle-service:
        condition: service_started
    environment:
      PORT: "8080"
      DB_SCHEMA: "activity"
      DATABASE_URL: "postgres://dipstick:dipstick@postgres:5432/dipstick?sslmode=disable"
      VEHICLE_SERVICE_URL: "http://vehicle-service:8080"
      # How long a vehicle lookup is cached before re-fetching. "0" disables it.
      VEHICLE_CACHE_TTL: "30s"
      # How often the background job deletes activity rows for vehicles that no
      # longer exist in vehicle-service. Short here so it's easy to observe; "0"
      # disables it. Production would use something like "1h".
      RECONCILE_INTERVAL: "30s"
    ports:
      # API is on http://localhost:8082 from the host.
      - "8082:8080"

volumes:
  postgres-data:
